<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCL Content Calendar</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>
  /* Apply the saved theme before first paint so the page never flashes the wrong one. */
  (function(){var t=null;try{t=localStorage.getItem("scl-theme");}catch(e){}
    if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5FA;--bg-glow:rgba(120,40,136,.10);
    --surface:#FFFFFF;--surface-2:#F3F0F7;--surface-3:#EBE6F1;
    --ink:#17121D;--ink-2:#3F3748;--muted:#6E6679;
    --rule:#E7E2EC;--rule-2:#D6CEDE;
    --accent:#782888;--accent-2:#9B3DAE;--accent-ink:#5A1D66;--accent-wash:#F3E8F6;
    --live:#0A8467;--live-wash:#E2F3EE;
    --sched:#3D5BD9;--sched-wash:#E8ECFC;
    --wait:#B06E06;--wait-wash:#FCF1DE;
    --shadow-sm:0 1px 2px rgba(23,18,29,.05);
    --shadow:0 1px 2px rgba(23,18,29,.04),0 12px 32px -16px rgba(23,18,29,.16);
    --nav:rgba(247,245,250,.78);
    --logo-bg:#FFFFFF;
    --sans:"Plus Jakarta Sans",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0E0B12;--bg-glow:rgba(178,103,196,.16);
    --surface:#17131C;--surface-2:#1F1A26;--surface-3:#28212F;
    --ink:#F1EEF4;--ink-2:#CBC4D3;--muted:#968EA1;
    --rule:#2A2431;--rule-2:#3A3243;
    --accent:#C07AD1;--accent-2:#D59BE2;--accent-ink:#E0B6EA;--accent-wash:#2A1D31;
    --live:#3DBE9A;--live-wash:#11271F;
    --sched:#8198F5;--sched-wash:#1A1F38;
    --wait:#E0A33A;--wait-wash:#2D2310;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 36px -18px rgba(0,0,0,.7);
    --nav:rgba(14,11,18,.74);
    --logo-bg:#FFFFFF;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0E0B12;--bg-glow:rgba(178,103,196,.16);
    --surface:#17131C;--surface-2:#1F1A26;--surface-3:#28212F;
    --ink:#F1EEF4;--ink-2:#CBC4D3;--muted:#968EA1;
    --rule:#2A2431;--rule-2:#3A3243;
    --accent:#C07AD1;--accent-2:#D59BE2;--accent-ink:#E0B6EA;--accent-wash:#2A1D31;
    --live:#3DBE9A;--live-wash:#11271F;
    --sched:#8198F5;--sched-wash:#1A1F38;
    --wait:#E0A33A;--wait-wash:#2D2310;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 36px -18px rgba(0,0,0,.7);
    --nav:rgba(14,11,18,.74);
    --logo-bg:#FFFFFF;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:84px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;
       line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
       background-image:radial-gradient(900px 420px at 85% -120px,var(--bg-glow),transparent 70%),
                        radial-gradient(700px 360px at -10% 0,var(--bg-glow),transparent 70%);
       background-repeat:no-repeat;min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  h1,h2,h3{margin:0;text-wrap:balance}

  /* ---- Top bar ---- */
  .nav{position:sticky;top:0;z-index:20;background:var(--nav);backdrop-filter:saturate(1.4) blur(14px);
       -webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--rule)}
  .nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .logo{background:var(--logo-bg);border-radius:9px;padding:6px 10px;border:1px solid var(--rule);
        box-shadow:var(--shadow-sm);display:flex;align-items:center}
  .logo img{display:block;height:28px;width:auto}
  .nav .who{font-size:13px;color:var(--muted);line-height:1.3;border-left:1px solid var(--rule);padding-left:14px}
  .nav .who b{display:block;color:var(--ink);font-weight:650;font-size:13.5px}
  .theme{margin-left:auto;display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);
         border:1px solid var(--rule);gap:2px}
  .theme button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;
                font-weight:600;color:var(--muted);padding:6px 12px;border-radius:999px;transition:all .18s}
  .theme button:hover{color:var(--ink)}
  .theme button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .theme button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .theme svg{width:15px;height:15px}

  /* ---- Hero ---- */
  .hero{padding:52px 0 26px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;
           text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .hero h1{font-size:clamp(32px,5vw,52px);line-height:1.04;letter-spacing:-.035em;font-weight:800}
  .hero h1 em{font-style:normal;background:linear-gradient(95deg,var(--accent),var(--accent-2));
              -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--ink-2);font-size:16.5px;margin:16px 0 0;max-width:36em}
  .sync{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12.5px;color:var(--muted);
        background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:5px 12px 5px 10px}
  .sync i{width:8px;height:8px;border-radius:50%;background:var(--live);position:relative}
  .sync i::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--live);opacity:.35;
                 animation:pulse 2s ease-out infinite}
  .sync.load i{background:var(--muted)} .sync.load i::after{display:none}
  .sync.err{color:var(--wait)} .sync.err i{background:var(--wait)} .sync.err i::after{display:none}
  @keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}

  /* Next-up card */
  .next{background:linear-gradient(145deg,var(--accent),var(--accent-ink));color:#fff;border-radius:18px;
        padding:22px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  :root[data-theme="dark"] .next{background:linear-gradient(145deg,#5E2170,#34133F)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:linear-gradient(145deg,#5E2170,#34133F)}}
  .next::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
               background:rgba(255,255,255,.08)}
  .next .lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
  .next .ttl{font-size:19px;font-weight:700;line-height:1.3;margin:8px 0 14px;letter-spacing:-.01em}
  .next .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
  .next .when{font-family:var(--mono);font-weight:600;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:7px}
  .next .in{opacity:.85}

  /* ---- Stats ---- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
  .stat{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;
        box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:transform .18s}
  .stat:hover{transform:translateY(-2px)}
  .stat .top{display:flex;align-items:center;justify-content:space-between}
  .stat .k{font-size:13px;font-weight:600;color:var(--muted)}
  .stat .dot{width:9px;height:9px;border-radius:50%}
  .stat .v{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat.pub .dot{background:var(--live)} .stat.pub .v{color:var(--live)}
  .stat.sch .dot{background:var(--sched)} .stat.sch .v{color:var(--sched)}
  .stat.pen .dot{background:var(--wait)} .stat.pen .v{color:var(--wait)}
  .stat.s179 .dot{background:var(--accent)} .stat.s179 .v{color:var(--accent)}

  .progress{margin-top:14px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;
            padding:14px 18px;box-shadow:var(--shadow)}
  .progress .head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:9px;gap:12px;flex-wrap:wrap}
  .progress .head b{color:var(--ink);font-weight:650}
  .bar{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
  .bar span{display:block;height:100%;transition:width .6s ease}
  .bar .p{background:var(--live)} .bar .s{background:var(--sched)} .bar .w{background:var(--wait)}

  /* ---- Toolbar ---- */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:38px 0 6px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:2px}
  .seg button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:7px}
  .seg button:hover{color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--accent)}
  .seg button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent-ink)}
  .jump{display:flex;gap:6px;flex-wrap:wrap}
  .jump a{font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px;
          border:1px solid var(--rule);background:var(--surface)}
  .jump a:hover{border-color:var(--accent);color:var(--accent)}
  .legend{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%}

  /* ---- Month ---- */
  .month{margin-top:30px;background:var(--surface);border:1px solid var(--rule);border-radius:18px;
         box-shadow:var(--shadow);overflow:hidden}
  .month-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 22px 14px}
  .month-head h2{font-size:22px;font-weight:750;letter-spacing:-.02em}
  .month-head h2 span{color:var(--muted);font-weight:500}
  .month-head .cnt{font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 16px 16px}
  .dow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
       text-align:center;padding:4px 0}
  .cell{min-height:84px;border-radius:10px;padding:6px 7px;background:var(--surface-2);
        display:flex;flex-direction:column;gap:4px;min-width:0;border:1px solid transparent}
  .cell.blank{background:transparent}
  .cell.wkend{opacity:.72}
  .cell.today{border-color:var(--accent);background:var(--accent-wash)}
  .cell .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:600}
  .cell.today .d{color:var(--accent)}
  .chip{all:unset;cursor:pointer;display:block;font-size:11.5px;font-weight:650;line-height:1.28;padding:5px 7px;
        border-radius:7px;overflow-wrap:anywhere;border-left:3px solid;transition:transform .15s,box-shadow .15s}
  .chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
  .chip:focus-visible{outline:2px solid var(--accent)}
  .chip b{display:block;font-family:var(--mono);font-size:10px;font-weight:600;opacity:.75;margin-bottom:1px}
  .chip.published{background:var(--live-wash);color:var(--live);border-color:var(--live)}
  .chip.scheduled{background:var(--sched-wash);color:var(--sched);border-color:var(--sched)}
  .chip.pending{background:var(--wait-wash);color:var(--wait);border-color:var(--wait)}

  .list{border-top:1px solid var(--rule);padding:6px 22px 10px}
  .item{display:grid;grid-template-columns:52px 118px 1fr auto;gap:4px 16px;align-items:center;
        padding:14px 0;border-bottom:1px dashed var(--rule);transition:background .3s}
  .item:last-child{border-bottom:0}
  .item.flash{background:var(--accent-wash);border-radius:10px}
  .item .no{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);text-align:center;
            background:var(--surface-2);border-radius:8px;padding:6px 0}
  .item .date{font-size:13px;line-height:1.35}
  .item .date b{display:block;font-weight:700;color:var(--ink)}
  .item .date span{color:var(--muted)}
  .item .t{font-weight:650;font-size:15px;line-height:1.4}
  .item .ch{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
            color:var(--accent);margin-bottom:2px}
  .item .n{color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .tag{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;
       background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
  .tag.s179{background:var(--accent-wash);color:var(--accent-ink);border-color:transparent}
  .tag.published{background:var(--live-wash);color:var(--live);border-color:transparent}
  .tag.scheduled{background:var(--sched-wash);color:var(--sched);border-color:transparent}
  .tag.pending{background:var(--wait-wash);color:var(--wait);border-color:transparent}
  .tag.published::before,.tag.scheduled::before,.tag.pending::before{content:"";display:inline-block;width:6px;height:6px;
       border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
  .empty{padding:18px 0;color:var(--muted);font-size:14px}

  /* ---- Rules ---- */
  .rules{margin-top:44px}
  .rules h2{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-bottom:14px}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .rule{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;
        box-shadow:var(--shadow);font-size:14px;color:var(--ink-2);line-height:1.5;display:flex;gap:12px}
  .rule .ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-wash);color:var(--accent);
            display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px}

  footer{margin:40px 0 0;padding:22px 0 60px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);
         display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
  footer b{color:var(--ink-2);font-weight:650}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr;padding-top:36px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .rgrid{grid-template-columns:1fr 1fr}
    .item{grid-template-columns:44px 1fr;}
    .item .date{grid-column:2}
    .item .body{grid-column:1 / -1}
    .item .tags{grid-column:1 / -1;justify-content:flex-start}
    .legend{margin-left:0}
  }
  @media (max-width:640px){
    .wrap{padding:0 16px}
    .nav .who{display:none}
    .theme button .tx{display:none}
    .theme button{padding:7px 10px}
    .rgrid{grid-template-columns:1fr}
    .grid{gap:3px;padding:0 8px 10px}
    .month-head{padding:16px 14px 10px}
    .list{padding:4px 14px 8px}
    .cell{min-height:52px;padding:4px;border-radius:7px}
    .chip{font-size:0;padding:0;height:6px;border-radius:3px;border-left:0}
    .chip b{display:none}
    .chip.published{background:var(--live)} .chip.scheduled{background:var(--sched)} .chip.pending{background:var(--wait)}
    .dow{font-size:9.5px;letter-spacing:.03em}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap">
  <div class="logo"><img id="logo" alt="SCL Equipment Finance"></div>
  <div class="who"><b>Barbara Griffith</b>SCL Equipment Finance</div>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-set="light" aria-pressed="false" title="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="tx">Light</span></button>
    <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="tx">Dark</span></button>
  </div>
</div></nav>

<main class="wrap" id="app"></main>

<script>
(function () {
  /* ---- Settings -------------------------------------------------------
     CSV_URL: the "Publish to web" CSV link of the Calendar sheet.
     Edit the sheet, and this page picks the change up on the next load
     (Google refreshes the published copy within about five minutes). */

];
  var SNAPSHOT_DATE = "26 September 2026";

  var LEDE = "Every post is proofed by you before it publishes. Section 179 builds through the calendar toward the 31 December placed-in-service deadline.";
  var RULES = [
    "Nothing publishes without your written approval — copy and image both.",
    "Drafts reach you the week before they are due to run.",
    "Every Section 179 post carries your tax-advisor line and links to your Section 179 page.",
    "Any post quoting a payment carries your illustration disclosure in full.",
    "A post without your approval waits. The slot moves; it is never filled with something unapproved.",
    "Topics and dates are yours to change at any point — tell us and we re-plan around it."
  ];
  var FOOTER = "Each post runs on your personal profile first and on the SCL company page the next day, one post a week. Pending dates move if approval is still open.";

  var MON = ["January","February","March","April","May","June","July",
             "August","September","October","November","December"];
  var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var LABEL = {published:"Published",scheduled:"Scheduled",pending:"Pending"};
  var app = document.getElementById("app");
  document.getElementById("logo").src = LOGO;

  /* ---- Theme: Light / Dark buttons; follows the device until one is clicked ---- */
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function current(){ return root.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light"); }
  function paintButtons(){
    var t = current();
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === t));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function(b){
    b.addEventListener("click", function(){
      var t = b.getAttribute("data-theme-set");
      root.setAttribute("data-theme", t);
      try { localStorage.setItem("scl-theme", t); } catch(e) {}
      paintButtons();
    });
  });
  if (mq && mq.addEventListener) mq.addEventListener("change", paintButtons);
  paintButtons();

  function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  /* RFC-4180 CSV: quoted fields, doubled quotes, commas and newlines inside quotes. */
  function csv(text){
    var rows=[], row=[], f="", q=false, i=0, c;
    text=text.replace(/^﻿/,"");
    for(;i<text.length;i++){
      c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
        else f+=c;
      } else if(c==='"') q=true;
      else if(c===","){row.push(f);f="";}
      else if(c==="\n"||c==="\r"){
        if(c==="\r"&&text[i+1]==="\n") i++;
        row.push(f);rows.push(row);row=[];f="";
      } else f+=c;
    }
    if(f!==""||row.length){row.push(f);rows.push(row);}
    return rows;
  }

  /* Accepts 2026-09-16, 9/16/2026 (or 16/9/2026), 16 Sep 2026, Sep 16, 2026. */
  function toIso(s){
    s=String(s||"").trim(); var m, y, mo, d;
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3];}
    else if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/))){
      y=+m[3];
      /* 16/9/2026 can only be day-first, 9/16/2026 only month-first; otherwise use the setting */
      if(+m[1]>12||(+m[2]<=12&&SLASH_DATES==="DMY")){d=+m[1];mo=+m[2];} else {mo=+m[1];d=+m[2];}
    }
    else if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\.?,?\s+(\d{4})/))){d=+m[1];mo=mIdx(m[2]);y=+m[3];}
    else if((m=s.match(/^([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/))){mo=mIdx(m[1]);d=+m[2];y=+m[3];}
    if(!y||!mo||!d||mo>12||d>31) return "";
    return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  }
  function mIdx(a){var i=MON.map(function(x){return x.slice(0,3).toLowerCase();}).indexOf(a.slice(0,3).toLowerCase());return i<0?0:i+1;}

  function fromRows(rows){
    if(!rows.length) return [];
    var head=rows[0].map(function(h){return h.trim().toLowerCase();});
    function col(){for(var i=0;i<arguments.length;i++){var k=head.indexOf(arguments[i]);if(k>-1)return k;}return -1;}
    var cD=col("date"), cT=col("title","post","topic"), cS=col("short label","short","label"),
        cN=col("note","notes"), cSt=col("status"), c179=col("section 179","s179"), cF=col("format");
    if(cD<0||cT<0) throw new Error("columns");
    return rows.slice(1).map(function(r){
      function g(c){return c<0?"":String(r[c]||"").trim();}
      var st=g(cSt).toLowerCase();
      return { date:toIso(g(cD)), t:g(cT), short:g(cS), n:g(cN),
               status: st.indexOf("publish")===0?"published":st.indexOf("sched")===0?"scheduled":"pending",
               s179: /^(y|yes|true|1|✓)$/i.test(g(c179)), format:g(cF) };
    }).filter(function(p){return p.date&&p.t;});
  }

  function parse(d){var a=String(d||"").split("-");return {y:+a[0],m:+a[1]-1,d:+a[2]};}
  function dt(d){var o=parse(d);return new Date(o.y,o.m,o.d);}
  function pretty(d){var o=parse(d);return o.d+" "+MON[o.m].slice(0,3)+" "+o.y;}
  function dowOf(d){return DOW[(dt(d).getDay()+6)%7];}
  function isoOf(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  function todayIso(){var t=new Date();return isoOf(t.getFullYear(),t.getMonth(),t.getDate());}

  /* "Profile — How Section 179 works." → channel "Profile", title "How Section 179 works." */
  function split(t){
    var m=String(t).match(/^(Profile|Company page)\s+[—–-]\s+(.*)$/i);
    return m?{ch:m[1],t:m[2]}:{ch:"",t:t};
  }
  function channelOf(p){var c=split(p.t).ch.toLowerCase();return c==="profile"?"profile":c?"page":"both";}

  var state={posts:[],sync:{text:"Loading the latest plan…",load:true},filter:"all"};
  try{var f=localStorage.getItem("scl-filter");if(f==="profile"||f==="page")state.filter=f;}catch(e){}

  function render(){
    var posts=state.posts.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    posts.forEach(function(p,i){p.no=String(i+1).padStart(2,"0");p.id="post-"+p.no;});
    function count(s){return posts.filter(function(p){return p.status===s;}).length;}
    var pub=count("published"), sched=count("scheduled"), pend=count("pending"), total=posts.length||1;
    var s179=posts.filter(function(p){return p.s179;}).length;
    var today=todayIso();
    var shown=posts.filter(function(p){var c=channelOf(p);return state.filter==="all"||c==="both"||c===state.filter;});

    /* next thing on the calendar that has not gone out yet */
    var next=posts.filter(function(p){return p.status!=="published"&&p.date>=today;})[0]||
             posts.filter(function(p){return p.status!=="published";})[0];

    var s=state.sync;
    var h='<section class="hero"><div>'+
      '<div class="eyebrow">LinkedIn · Content plan</div>'+
      "<h1>Content <em>Calendar</em></h1>"+
      "<p>"+esc(LEDE)+"</p>"+
      '<span class="sync'+(s.err?" err":s.load?" load":"")+'"><i></i>'+esc(s.text)+"</span></div>";
    if(next){
      var sp=split(next.t), days=Math.round((dt(next.date)-dt(today))/864e5);
      var rel=days===0?"today":days===1?"tomorrow":days>1?"in "+days+" days":Math.abs(days)+" day"+(days===-1?"":"s")+" ago";
      h+='<a class="next" href="#'+next.id+'" style="text-decoration:none"><div class="lbl">Next up · '+LABEL[next.status]+"</div>"+
        '<div class="ttl">'+esc(sp.t)+"</div>"+
        '<div class="row"><span class="when">'+dowOf(next.date)+" "+pretty(next.date)+'</span><span class="in">'+
        (sp.ch?esc(sp.ch)+" · ":"")+rel+"</span></div></a>";
    } else {
      h+='<div class="next"><div class="lbl">Next up</div><div class="ttl">Everything on the plan has been published.</div></div>';
    }
    h+="</section>";

    h+='<section class="stats">'+
      '<div class="stat pub"><div class="top"><span class="k">Published</span><i class="dot"></i></div><span class="v">'+pub+"</span></div>"+
      '<div class="stat sch"><div class="top"><span class="k">Scheduled</span><i class="dot"></i></div><span class="v">'+sched+"</span></div>"+
      '<div class="stat pen"><div class="top"><span class="k">Pending</span><i class="dot"></i></div><span class="v">'+pend+"</span></div>"+
      '<div class="stat s179"><div class="top"><span class="k">On Section 179</span><i class="dot"></i></div><span class="v">'+s179+"</span></div></section>";

    var last=posts.length?posts[posts.length-1].date:"";
    h+='<div class="progress"><div class="head"><span><b>'+pub+" of "+posts.length+"</b> posts published</span>"+
      (last?"<span>Plan runs to <b>"+pretty(last)+"</b></span>":"")+"</div>"+
      '<div class="bar"><span class="p" style="width:'+(pub/total*100)+'%"></span><span class="s" style="width:'+(sched/total*100)+
      '%"></span><span class="w" style="width:'+(pend/total*100)+'%"></span></div></div>';

    var months=[], seen={};
    posts.forEach(function(p){var o=parse(p.date),k=o.y+"-"+o.m;if(!seen[k]){seen[k]=1;months.push(o);}});

    h+='<div class="toolbar"><div class="seg" role="group" aria-label="Channel">'+
      [["all","All"],["profile","Profile"],["page","Company page"]].map(function(o){
        return '<button type="button" data-filter="'+o[0]+'" aria-pressed="'+(state.filter===o[0])+'">'+o[1]+"</button>";}).join("")+
      '</div><nav class="jump" aria-label="Months">'+months.map(function(mo){
        return '<a href="#m-'+mo.y+"-"+mo.m+'">'+MON[mo.m].slice(0,3)+"</a>";}).join("")+"</nav>"+
      '<div class="legend"><span><i style="background:var(--live)"></i>Published</span>'+
      '<span><i style="background:var(--sched)"></i>Scheduled</span><span><i style="background:var(--wait)"></i>Pending</span></div></div>';

    months.forEach(function(mo){
      var lead=(new Date(mo.y,mo.m,1).getDay()+6)%7, days=new Date(mo.y,mo.m+1,0).getDate();
      var inMonth=shown.filter(function(p){var o=parse(p.date);return o.y===mo.y&&o.m===mo.m;});
      var g='<div class="grid">'+DOW.map(function(d){return '<div class="dow">'+d+"</div>";}).join("");
      for(var i=0;i<lead;i++) g+='<div class="cell blank"></div>';
      for(var d=1;d<=days;d++){
        var day=isoOf(mo.y,mo.m,d), wd=(lead+d-1)%7, chips="";
        inMonth.forEach(function(p){ if(p.date!==day) return;
          var lbl=p.short||p.t.split(" ").slice(0,3).join(" ");
          chips+='<a class="chip '+p.status+'" href="#'+p.id+'" title="'+esc(p.t)+" — "+LABEL[p.status]+'"><b>'+p.no+"</b>"+esc(lbl)+"</a>"; });
        g+='<div class="cell'+(wd>4?" wkend":"")+(day===today?" today":"")+'"><span class="d">'+d+"</span>"+chips+"</div>";
      }
      g+="</div>";
      var list=inMonth.map(function(p){
        var sp=split(p.t), tags="";
        if(p.s179) tags+='<span class="tag s179">Section 179</span>';
        if(p.format) tags+='<span class="tag">'+esc(p.format)+"</span>";
        tags+='<span class="tag '+p.status+'">'+LABEL[p.status]+"</span>";
        return '<div class="item" id="'+p.id+'"><span class="no">'+p.no+"</span>"+
          '<span class="date"><b>'+pretty(p.date)+"</b><span>"+dowOf(p.date)+"</span></span>"+
          '<div class="body">'+(sp.ch?'<span class="ch">'+esc(sp.ch)+"</span>":"")+
          '<div class="t">'+esc(sp.t)+"</div>"+(p.n?'<div class="n">'+esc(p.n)+"</div>":"")+"</div>"+
          '<span class="tags">'+tags+"</span></div>";
      }).join("")||'<div class="empty">No posts on this channel this month.</div>';
      h+='<section class="month" id="m-'+mo.y+"-"+mo.m+'"><div class="month-head"><h2>'+MON[mo.m]+" <span>"+mo.y+"</span></h2>"+
        '<span class="cnt">'+inMonth.length+" post"+(inMonth.length===1?"":"s")+"</span></div>"+g+
        '<div class="list">'+list+"</div></section>";
    });

    h+='<section class="rules"><h2>How this runs</h2><div class="rgrid">'+RULES.map(function(r,i){
      return '<div class="rule"><span class="ic">'+(i+1)+"</span><span>"+esc(r)+"</span></div>";}).join("")+"</div></section>";
    h+="<footer><span>"+esc(FOOTER)+"</span><span><b>Accord Tech Solutions</b> · LinkedIn Marketing</span></footer>";
    app.innerHTML=h;
  }

  app.addEventListener("click", function(e){
    var b=e.target.closest("[data-filter]");
    if(b){ state.filter=b.getAttribute("data-filter");
      try{localStorage.setItem("scl-filter",state.filter);}catch(err){}
      render(); return; }
    var a=e.target.closest('a[href^="#post-"]');
    if(a){ var el=document.getElementById(a.getAttribute("href").slice(1));
      if(el){ el.classList.add("flash"); setTimeout(function(){el.classList.remove("flash");},1600); } }
  });

  function show(posts, sync){ state.posts=posts; state.sync=sync; render(); }
  show(SNAPSHOT, {text:"Loading the latest plan…", load:true});

  if(CSV_URL.indexOf("http")!==0){
    show(SNAPSHOT, {text:"Plan as of "+SNAPSHOT_DATE});
    return;
  }
  fetch(CSV_URL+(CSV_URL.indexOf("?")>-1?"&":"?")+"_="+Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){
      var posts=fromRows(csv(t));
      if(!posts.length) throw new Error("empty");
      var now=new Date();
      show(posts, {text:"Live · updated "+now.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+", "+
        now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})});
    })
    .catch(function(){
      show(SNAPSHOT, {text:"Could not reach the live plan — showing the "+SNAPSHOT_DATE+" copy. Refresh to try again.", err:true});
    });
})();
