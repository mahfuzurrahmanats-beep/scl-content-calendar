<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCL Content Calendar</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ground:#FBFAFC;--surface:#FFFFFF;--surface-2:#F5F2F7;
    --ink:#1A1520;--ink-2:#453D4E;--muted:#6B6473;
    --rule:#E6E2EA;--rule-2:#D5CEDC;
    --accent:#782888;--accent-deep:#5A1D66;--accent-wash:#F3E9F5;
    --live:#07866A;--live-wash:#E3F2ED;
    --wait:#B87309;--wait-wash:#FBF0DC;
    --shadow:0 1px 2px rgba(26,21,32,.04),0 10px 30px -18px rgba(26,21,32,.13);
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --body:ui-sans-serif,-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --data:ui-monospace,"Cascadia Mono","SF Mono",SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#141118;--surface:#1D1922;--surface-2:#262130;
    --ink:#EDEAF0;--ink-2:#C9C3D1;--muted:#9A93A3;
    --rule:#2E2836;--rule-2:#3D3548;
    --accent:#B267C4;--accent-deep:#C88BD6;--accent-wash:#2B1F31;
    --live:#2E9C82;--live-wash:#14261F;
    --wait:#BC8418;--wait-wash:#2A2110;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.6);
  }}

  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;
       line-height:1.6;-webkit-font-smoothing:antialiased;margin:0;padding:0 20px 90px}
  .wrap{max-width:980px;margin:0 auto}
  h1,h2{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}

  header{padding:40px 0 20px;margin-bottom:22px;border-bottom:2px solid var(--accent);
         display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;flex-direction:column;gap:14px}
  .logo{background:#fff;border-radius:6px;padding:11px 14px;width:max-content;max-width:100%;
        box-shadow:var(--shadow);border:1px solid var(--rule)}
  .logo img{display:block;width:210px;max-width:100%;height:auto}
  header h1{font-size:clamp(24px,3.4vw,32px);line-height:1.14;letter-spacing:-.018em}
  header .meta{font-size:13px;color:var(--muted);text-align:right;line-height:1.55}
  header .meta b{display:block;color:var(--ink-2);font-weight:600;font-size:13.5px}

  .glance{display:grid;gap:11px;grid-template-columns:repeat(4,1fr);margin-bottom:13px}
  .g{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:14px 15px;
     box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
  .g .v{font-family:var(--data);font-size:24px;font-weight:600;color:var(--accent);
        letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .g .k{font-size:12.5px;font-weight:650;color:var(--ink);line-height:1.3}
  .g.pub .v{color:var(--live)}
  .g.pend .v{color:var(--wait)}
  .lede{font-size:14.5px;color:var(--muted);margin:0 0 6px;line-height:1.55}

  .key{display:flex;flex-wrap:wrap;gap:8px 16px;margin:16px 0 0;font-size:12.5px;color:var(--ink-2);align-items:center}
  .key span{display:inline-flex;align-items:center;gap:6px}
  .key i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--rule-2)}
  .key .sync{margin-left:auto;color:var(--muted);font-size:12px}
  .key .sync.err{color:var(--wait)}

  .cal{margin-top:30px}
  .cal h2{font-size:20px;margin-bottom:11px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
        background:var(--surface);border:1px solid var(--rule);border-radius:6px;
        padding:10px;box-shadow:var(--shadow)}
  .dow{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
       color:var(--muted);text-align:center;padding:2px 0 5px}
  .cell{min-height:74px;border-radius:4px;padding:5px 6px;background:var(--surface-2);
        display:flex;flex-direction:column;gap:4px;min-width:0}
  .cell.blank{background:transparent}
  .cell.today{outline:1.5px solid var(--accent);outline-offset:-1px}
  .cell .d{font-family:var(--data);font-size:11.5px;color:var(--muted);font-weight:600}
  .chip{font-size:11.5px;font-weight:650;line-height:1.25;padding:4px 6px;border-radius:4px;
        background:var(--accent-wash);color:var(--accent-deep);border-left:3px solid var(--accent);
        overflow-wrap:anywhere}
  .chip b{font-family:var(--data);font-weight:700;display:block;font-size:10.5px;opacity:.8}
  .chip.published{background:var(--live-wash);color:var(--live);border-left-color:var(--live)}
  .chip.pending{background:var(--wait-wash);color:var(--wait);border-left-color:var(--wait)}

  .list{margin-top:12px;display:flex;flex-direction:column}
  .item{display:grid;grid-template-columns:88px 1fr auto;gap:4px 14px;align-items:baseline;
        padding:10px 2px;border-bottom:1px solid var(--rule)}
  .item:last-of-type{border-bottom:0}
  .item .when{font-family:var(--data);font-size:12.5px;color:var(--accent);font-weight:600}
  .item .when small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px}
  .item .txt{font-size:14.5px;color:var(--ink);line-height:1.45}
  .item .txt .t{font-weight:650}
  .item .txt .n{color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;align-items:center}
  .tag{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:3px;
       border:1px solid var(--rule-2);color:var(--muted);white-space:nowrap}
  .tag.s179{color:var(--accent);border-color:var(--accent);background:var(--accent-wash)}
  .tag.published{color:var(--live);border-color:var(--live);background:var(--live-wash)}
  .tag.pending{color:var(--wait);border-color:var(--wait);background:var(--wait-wash)}

  .rules{margin-top:34px;padding:19px 22px;background:var(--accent-wash);
         border:1px solid var(--accent);border-radius:5px}
  .rules h3{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.09em;
            text-transform:uppercase;color:var(--accent-deep);margin:0 0 11px}
  .rules ul{margin:0;padding:0;list-style:none;display:grid;gap:8px 24px;grid-template-columns:repeat(2,1fr)}
  .rules li{font-size:14px;color:var(--ink-2);line-height:1.45;padding-left:14px;position:relative}
  .rules li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;
                    border-radius:50%;background:var(--accent)}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
         font-size:12.5px;color:var(--muted);line-height:1.6}

  @media (max-width:820px){
    .glance{grid-template-columns:repeat(2,1fr)}
    .rules ul{grid-template-columns:1fr}
    header{align-items:flex-start}
    header .meta{text-align:left}
    .grid{gap:3px;padding:7px}
    .cell{min-height:58px;padding:4px}
    .chip{font-size:10px;padding:3px 4px}
    .item{grid-template-columns:1fr}
    .tags{justify-content:flex-start}
    .key .sync{margin-left:0;flex-basis:100%}
  }
</style>
</head>

  function toIso(s){
    s=String(s||"").trim(); var m, y, mo, d;
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3];}
    else if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/))){
      y=+m[3];
      /* 16/9/2026 can only be day-first, 9/16/2026 only month-first; otherwise use the setting */
      if(+m[1]>12||(+m[2]<=12&&SLASH_DATES==="DMY")){d=+m[1];mo=+m[2];} else {mo=+m[1];d=+m[2];}
    }
    else if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\.?,?\s+(\d{4})/))){d=+m[1];mo=mIdx(m[2]);y=+m[3];}
    else if((m=s.match(/^([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/))){mo=mIdx(m[1]);d=+m[2];y=+m[3];}
    if(!y||!mo||!d||mo>12||d>31) return "";
    return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  }
  function mIdx(a){var i=MON.map(function(x){return x.slice(0,3).toLowerCase();}).indexOf(a.slice(0,3).toLowerCase());return i<0?0:i+1;}

  function fromRows(rows){
    if(!rows.length) return [];
    var head=rows[0].map(function(h){return h.trim().toLowerCase();});
    function col(){for(var i=0;i<arguments.length;i++){var k=head.indexOf(arguments[i]);if(k>-1)return k;}return -1;}
    var cD=col("date"), cT=col("title","post","topic"), cS=col("short label","short","label"),
        cN=col("note","notes"), cSt=col("status"), c179=col("section 179","s179"), cF=col("format");
    if(cD<0||cT<0) throw new Error("columns");
    return rows.slice(1).map(function(r){
      function g(c){return c<0?"":String(r[c]||"").trim();}
      var st=g(cSt).toLowerCase();
      return { date:toIso(g(cD)), t:g(cT), short:g(cS), n:g(cN),
               status: st.indexOf("publish")===0?"published":"pending",
               s179: /^(y|yes|true|1|✓)$/i.test(g(c179)), format:g(cF) };
    }).filter(function(p){return p.date&&p.t;});
  }

  function parse(d){var a=String(d||"").split("-");return {y:+a[0],m:+a[1]-1,d:+a[2]};}
  function pretty(d){var o=parse(d);return o.d+" "+MON[o.m].slice(0,3)+" "+o.y;}
  function dowOf(d){var o=parse(d);return DOW[(new Date(o.y,o.m,o.d).getDay()+6)%7];}
  function isoOf(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
  function todayIso(){var t=new Date();return isoOf(t.getFullYear(),t.getMonth(),t.getDate());}

  function render(posts, sync){
    posts=posts.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    posts.forEach(function(p,i){p.no=String(i+1).padStart(2,"0");});
    var pub=posts.filter(function(p){return p.status==="published";}).length;
    var s179=posts.filter(function(p){return p.s179;}).length;
    var last=posts.length?parse(posts[posts.length-1].date):null;
    var today=todayIso();

    var h='<header><div class="brand">'+
      '<div class="logo"><img alt="SCL Equipment Finance" src="'+LOGO+'"></div>'+
      "<h1>LinkedIn Content Calendar</h1></div>"+
      '<div class="meta"><b>Barbara Griffith</b>SCL Equipment Finance<br><br>'+
      "LinkedIn Marketing Department<br>Accord Tech Solutions</div></header>";

    h+='<div class="glance">'+
      '<div class="g pub"><span class="v">'+pub+'</span><span class="k">Published</span></div>'+
      '<div class="g pend"><span class="v">'+(posts.length-pub)+'</span><span class="k">Pending</span></div>'+
      '<div class="g"><span class="v">'+s179+'</span><span class="k">On Section 179</span></div>'+
      '<div class="g"><span class="v">'+(last?last.d+" "+MON[last.m].slice(0,3):"—")+
        '</span><span class="k">Plan runs to</span></div></div>';

    h+='<p class="lede">'+esc(LEDE)+"</p>";

    h+='<div class="key"><span><i style="background:var(--live-wash);border-color:var(--live)"></i>Published</span>'+
      '<span><i style="background:var(--wait-wash);border-color:var(--wait)"></i>Pending</span>'+
      '<span class="sync'+(sync.err?" err":"")+'">'+esc(sync.text)+"</span></div>";

    var months=[], seen={};
    posts.forEach(function(p){var o=parse(p.date),k=o.y+"-"+o.m;if(!seen[k]){seen[k]=1;months.push(o);}});
    months.forEach(function(mo){
      var lead=(new Date(mo.y,mo.m,1).getDay()+6)%7, days=new Date(mo.y,mo.m+1,0).getDate();
      var g='<div class="grid">'+DOW.map(function(d){return '<div class="dow">'+d+"</div>";}).join("");
      for(var i=0;i<lead;i++) g+='<div class="cell blank"></div>';
      for(var d=1;d<=days;d++){
        var day=isoOf(mo.y,mo.m,d), chips="";
        posts.forEach(function(p){ if(p.date!==day) return;
          var lbl=p.short||p.t.split(" ").slice(0,3).join(" ");
          chips+='<span class="chip '+p.status+'"><b>'+p.no+"</b>"+esc(lbl)+"</span>"; });
        g+='<div class="cell'+(day===today?" today":"")+'"><span class="d">'+d+"</span>"+chips+"</div>";
      }
      g+="</div>";
      var list=posts.filter(function(p){var o=parse(p.date);return o.y===mo.y&&o.m===mo.m;}).map(function(p){
        var tags="";
        if(p.s179) tags+='<span class="tag s179">Section 179</span>';
        if(p.format) tags+='<span class="tag">'+esc(p.format)+"</span>";
        tags+='<span class="tag '+p.status+'">'+(p.status==="published"?"Published":"Pending")+"</span>";
        return '<div class="item"><span class="when">'+p.no+"<small>"+dowOf(p.date)+" "+pretty(p.date)+
          '</small></span><span class="txt"><span class="t">'+esc(p.t)+'</span> <span class="n">'+esc(p.n)+
          '</span></span><span class="tags">'+tags+"</span></div>";
      }).join("");
      h+='<section class="cal"><h2>'+MON[mo.m]+" "+mo.y+"</h2>"+g+'<div class="list">'+list+"</div></section>";
    });

    h+='<div class="rules"><h3>How this runs</h3><ul>'+RULES.map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+"</ul></div>";
    h+="<footer>"+esc(FOOTER)+"</footer>";
    app.innerHTML=h;
  }

  render(SNAPSHOT, {text:"Loading the latest plan…"});

  if(CSV_URL.indexOf("http")!==0){
    render(SNAPSHOT, {text:"Plan as of "+SNAPSHOT_DATE});
    return;
  }
  fetch(CSV_URL+(CSV_URL.indexOf("?")>-1?"&":"?")+"_="+Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){
      var posts=fromRows(csv(t));
      if(!posts.length) throw new Error("empty");
      var now=new Date();
      render(posts, {text:"Live plan · checked "+now.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+", "+
        now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})});
    })
    .catch(function(){
      render(SNAPSHOT, {text:"Could not reach the live plan — showing the "+SNAPSHOT_DATE+" copy. Refresh to try again.", err:true});
    });
})();
</script>
</body>
</html>
